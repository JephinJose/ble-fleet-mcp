[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ble-fleet-mcp"
version = "0.1.0"
description = "MCP server for managing fleets of constrained-connection devices (BLE and beyond) without the agent reasoning about hardware connection limits."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "fleet-mcp contributors" },
]
keywords = ["mcp", "ble", "bluetooth", "bleak", "fleet", "iot", "zigbee", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
    "Topic :: Home Automation",
]

dependencies = [
    "mcp>=1.2.0",
    "bleak>=0.22.3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/JephinJose/ble-fleet-mcp"
Repository = "https://github.com/JephinJose/ble-fleet-mcp"
Issues = "https://github.com/JephinJose/ble-fleet-mcp/issues"
Changelog = "https://github.com/JephinJose/ble-fleet-mcp/blob/main/CHANGELOG.md"

[project.scripts]
fleet-mcp = "fleet_mcp.server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "ASYNC",         # async-specific lint rules
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fleet_mcp"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["^src/fleet_mcp/transports/ble/"]

[[tool.mypy.overrides]]
module = "fleet_mcp.transports.ble.*"
strict = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "bleak.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "soak: long-running soak tests over a large simulated fleet",
    "chaos: chaos-injection tests against the simulated fleet",
]
